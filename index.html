<script>
    // Criação do objeto de áudio dinâmico via JS
    let music = new Audio('musica_de_fundo.mp3');
    music.loop = true;
    music.volume = 0.5;

    function showPage(pageId) {
        document.querySelectorAll('.page').forEach(page => {
            page.classList.remove('active');
        });
        document.getElementById(pageId).classList.add('active');
    }

    function toggleMusic() {
        const btn = document.getElementById("music-btn");

        if (music.paused) {
            // Força o recarregamento do arquivo e tenta tocar após o clique do usuário
            music.play().then(() => {
                btn.innerText = "🎵 Música: On";
            }).catch(error => {
                console.error("Erro ao tentar tocar:", error);
                alert("O navegador bloqueou o som ou o arquivo não foi carregado corretamente.");
            });
        } else {
            music.pause();
            btn.innerText = "🎵 Música: Off";
        }
    }
</script>
